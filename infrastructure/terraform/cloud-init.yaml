#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - ufw
  - htop

runcmd:
  # Install Docker GPG key & repository
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin

  # Enable Docker service
  - systemctl enable docker
  - systemctl start docker

  # Configure UFW Firewall rules
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 3000/tcp
  - ufw allow 3001/tcp
  - ufw --force enable

  # Create Aero production workspace directory
  - mkdir -p /var/aero/production
  - mkdir -p /var/aero/certs
  - mkdir -p /var/aero/backups

  # Log cloud-init completion
  - echo "Aero PaaS production cloud server bootstrap completed successfully at $(date)" > /var/log/aero-bootstrap.log
