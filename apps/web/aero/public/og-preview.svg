<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Van Gogh Midnight Obsidian -->
  <rect width="1200" height="630" fill="#080b12"/>
  
  <!-- Subtle Celestial Grid Lines -->
  <path d="M0 157.5H1200M0 315H1200M0 472.5H1200M300 0V630M600 0V630M900 0V630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  
  <!-- Radial Celestial Aura Glow -->
  <circle cx="600" cy="260" r="320" fill="url(#cyanGlow)" fill-opacity="0.15"/>
  <circle cx="450" cy="200" r="180" fill="url(#indigoGlow)" fill-opacity="0.18"/>

  <!-- Aero Logo -->
  <g transform="translate(564, 110) scale(3)">
    <path d="M2 12L22 2L17 22L12 14L2 12Z" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="rgba(56, 189, 248, 0.08)"/>
    <path d="M22 2L12 14" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <text x="600" y="270" text-anchor="middle" fill="#f3f0ea" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" letter-spacing="4">AERO PAAS</text>
  <text x="600" y="370" text-anchor="middle" fill="#f3f0ea" font-family="Georgia, serif" font-size="64" font-style="italic" font-weight="400">Your hardware. Your cloud.</text>
  <text x="600" y="440" text-anchor="middle" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400">Self-Hosted Platform-as-a-Service · Zero Cloud Bills · Docker Native</text>

  <!-- Inset Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <!-- Definitions -->
  <defs>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 260) rotate(90) scale(320)">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(450 200) rotate(90) scale(180)">
      <stop stop-color="#2d3a6a"/>
      <stop offset="1" stop-color="#2d3a6a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
