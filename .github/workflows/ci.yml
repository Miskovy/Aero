name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type Check (TypeScript)
        # Assumes you have a "typecheck" script in your root package.json.
        # Alternatively, you can run: npx tsc --noEmit
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test

      - name: Build All Packages
        run: npm run build
